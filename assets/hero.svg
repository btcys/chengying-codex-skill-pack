    <text x="2" y="208" fill="#a7f3d0" font-size="18" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">从指定 PRD 到真实验收与正式发布，保持边界清楚、证据可追踪、开发不拖慢。</text>
    <g transform="translate(0 238)">
