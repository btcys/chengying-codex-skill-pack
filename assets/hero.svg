  </defs>
  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1090" cy="-20" r="270" fill="#38bdf8" opacity="0.12"/>
  <circle cx="1190" cy="310" r="210" fill="#a7f3d0" opacity="0.10"/>
  <path d="M0 290C220 220 330 350 550 270S900 180 1280 250V360H0Z" fill="#020617" opacity="0.18"/>

