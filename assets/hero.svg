    <text x="59" y="25" text-anchor="middle" fill="#0f172a" font-size="17" font-weight="700" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">CODEX SKILL PACK</text>
    <text x="0" y="112" fill="#ffffff" font-size="52" font-weight="800" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">帧芯开发工作流</text>
