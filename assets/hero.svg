<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="720" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc" style="shape-rendering:geometricPrecision;text-rendering:geometricPrecision">
  <title id="title">帧芯开发工作流 6.2</title>
  <desc id="desc">面向长期商业项目的产品、Design-Brief、UI、计划与智能体开发工作流</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10182f"/>
      <stop offset="0.55" stop-color="#1c3156"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9a8d4"/>
      <stop offset="0.5" stop-color="#a7f3d0"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity="0.28"/>
