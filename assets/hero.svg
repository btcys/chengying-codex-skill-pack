      <rect x="108" width="112" height="34" rx="17" fill="#ffffff" opacity="0.12"/>
      <text x="164" y="23" text-anchor="middle" fill="#ffffff" font-size="16" font-family="Arial, PingFang SC, sans-serif">MIT License</text>
    </g>
